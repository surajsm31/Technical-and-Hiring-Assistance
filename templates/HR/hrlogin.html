<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiring Recruiter Login</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color:#97d5e2;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h3 class="text-center"><u> Login </u></h3>
        {% include 'msg.html' %}

        <form action="hr_validate" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="uname" placeholder="Enter email" required>
                <small id="emailError" class="text-danger"></small>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="psw" placeholder="Enter password" required>
                <input type="checkbox" onclick="password.type = this.checked ? 'text' : 'password' "><i style="font-size:15px;"> Check Password</i>
                <small id="passwordError" class="text-danger"></small>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <hr>
            <h6>If you don't have account, <a href="hrregister" style="font-size:15px">Register here</a></h6>
            <h6>Don't Remember Password, <a href="forget_hr_password" style="font-size:15px">forget Password?</a></h6>

        </form>
    </div>

    <script>
        document.getElementById('email').addEventListener('input', function () {
            const email = this.value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            document.getElementById('emailError').textContent = emailPattern.test(email) ? '' : 'Invalid email format';
        });

        document.getElementById('password').addEventListener('input', function () {
            const password = this.value;
            document.getElementById('passwordError').textContent = password.length >= 8 ? '' : 'Password must be at least 8 characters';
        });

        setTimeout(function()
          {
            if($("#msg").length > 0)
             {
                $("#msg").remove();
             }
          },3000);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
