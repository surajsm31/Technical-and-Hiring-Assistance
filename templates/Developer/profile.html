{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #97d5e2;
            text-align: center;
            margin: 0;
        }
        .container {
            width: 50%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .profile-pic {
            width: 140px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #007bff;
        }
        .info {
            margin: 20px 0;
            font-size: 18px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        @media (max-width: 768px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container" style="margin-top:50px;">
        {% include 'msg.html' %}
        <h2>Developer Profile</h2>
        <img src="{% static 'images/bmw.jfif' %}" alt="Profile Picture" class="profile-pic">
        <div class="info">
            {% for i in data %}
            <p><strong>Name:</strong> {{ i.fname }}</p>
            <p><strong>Email:</strong> {{ i.email }}</p>
            <p><strong>Skills:</strong> {{ i.skill }}</p>
            <p><strong>Experience:</strong> {{ i.experience }}</p>
            <p><strong>Github:</strong><a href="{{ i.github }}">{{ i.github }}</a></p>
            <p><strong>Portfolio:</strong><a href="{{ i.portfolio }}">{{ i.portfolio }}</a></p>
            {% endfor %}
        </div>
        <a href="update_dprofile"><button onclick="updateProfile()"><i class="fa fa-edit"></i> Update Profile</button></a>
        <a href="dpass_change"><button onclick="changePassword()"><i class="fa fa-lock"></i> Change Password</button></a>
        <button onclick="goBack()"><i class="fa fa-arrow-left"></i> Go Back</button>
    </div>

    <script>
        function updateProfile() {
            alert("Redirecting to update profile page...");
        }
        function changePassword() {
            alert("Redirecting to change password page...");
        }
        function goBack() {
            window.history.back();
        }

        setTimeout(function()
          {
            if($("#msg").length > 0)
             {
                $("#msg").remove();
             }
          },3000);
    </script>
</body>
</html>
