<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .otp-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .btn-custom {
            width: 120px;
        }
    </style>
</head>
<body>
    <div class="otp-container">
        <h3 class="mb-4">OTP Verification</h3>
        <p>Please enter the OTP sent to your registered email {{ email }}.</p>
        <form action="verify_dev_fpass" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="hidden" name="email" value="{{ email }}">
                <input type="text" name="otp" id="otp" required class="form-control text-center" maxlength="6" placeholder="Enter OTP">
                <small id="otpError" class="text-danger"></small>
            </div>
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success btn-custom">Verify</button>
<!--                <a href="register"><button type="button" class="btn btn-secondary btn-custom" id="resendOtp">Resend OTP</button></a>-->
            </div>
        </form>
    </div>

    <script>
        document.getElementById('otp').addEventListener('input', function () {
            const otpPattern = /^[0-9]{6}$/;
            document.getElementById('otpError').textContent = otpPattern.test(this.value) ? '' : 'OTP must be 6 digits';
        });

        document.getElementById('resendOtp').addEventListener('click', function () {
            alert('OTP has been resent to your email.');
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
