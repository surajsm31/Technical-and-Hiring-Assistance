<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a7f5da;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }
        .form-group {
            margin: 15px 15px;
            text-align: left;
        }
        label {
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
        }
        .btn-cancel {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Update Profile</h2>
        <img src="/static/images/bmw.jfif" alt="Profile Picture" class="profile-pic">
        <form action="dprofile_update" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {% for i in data %}
            <div class="form-group">
                <label for="name">Full Name :</label>
                <input type="text" id="name" name="name" value="{{ i.fname }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" value="{{ i.email }}" readonly required>
            </div>
            <div class="form-group">
                <label for="education">Education :</label>
                <input type="text" id="education" name="education" value="{{ i.education }}" required>
            </div>
            <div class="form-group">
                <label for="skills">Skills :</label>
                <input type="text" id="skills" name="skills" value="{{ i.skill }}" required>
            </div>
            <div class="form-group">
                <label for="experience">Experience :</label>
                <input type="text" id="experience" name="experience" value="{{ i.experience }}" required>
            </div>
            <div class="form-group">
                <label for="github">Github :</label>
                <input type="text" id="github" name="github" value="{{ i.github }}" required>
            </div>
            <div class="form-group">
                <label for="portfolio">Portfolio :</label>
                <input type="text" id="portfolio" name="portfolio" value="{{ i.portfolio }}" placeholder="Enter Portfolio Link (Optional)">
            </div>
            <div class="form-group">
                <label for="contact">Contact Number :</label>
                <input type="text" id="contact" name="contact" value="{{ i.contact }}">
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-save">Save Changes</button>
            <button type="button" class="btn btn-cancel" onclick="window.history.back();">Cancel</button>
        </form>
    </div>
</body>
</html>
