<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Card</title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<!--    <link rel="stylesheet" href="styles.css">-->
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    text-align: center;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
    background-image: linear-gradient(to bottom left, #43d6f4, #eff3f4, #9ddd94);
    background-repeat:no-repeat;
    background-size:cover;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

.score-card {
    background-color: #0077b6;
    color: #fff;
    padding: 20px;
    border-radius: 5px;
    margin-bottom: 20px;
}

.score-card h2 {
    font-size: 48px;
    margin: 0;
}

.result {
    color: #007a5a;
    font-weight: bold;
}

.confetti {
    width: 100%;
    height: 100px;
    background-image: url('https://via.placeholder.com/600x100/ff8800/ffffff?text=Confetti');
    background-repeat: repeat-x;
    animation: confetti 5s infinite linear;
}

@keyframes confetti {
    0% {
        background-position: 0 0;
    }
    100% {
        background-position: 600px 0;
    }
}
    </style>
</head>
<body>
    <div class="container " style="margin-top:100px">
        <h1>Your total score is</h1>
        <div class="score-card">
            <h2>{{ data1 }}</h2>
            <p>{{ data1 }} correct answers out of {{ data }}</p>
        </div>
    <!--        <p class="result">100% — Congratulations! You are a spelling champion.</p>-->
        <div class="confetti"></div>
        <br>
        <center>
            <button class="btn btn-outline-primary"><a href="/home"> Home Page </a></button>
        </center>
    </div>
</body>
</html>
