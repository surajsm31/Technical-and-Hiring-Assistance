<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .forgot-password-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .btn-custom {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="forgot-password-container">
        <h3 class="mb-3">Forgot Password</h3>
        <p class="text-muted">Enter your registered email to receive a password reset OTP.</p>
        <form action="reset_dev_password" method="POST" id="passwordForm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" id="email" required class="form-control" placeholder="Enter your email">
                <small id="emailError" class="text-danger"></small>
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" name="new_pass" class="form-control" id="newPassword" placeholder="Enter new password" required>
                <small id="passwordError" class="text-danger"></small>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" name="confirm_pass" class="form-control" id="confirmPassword" placeholder="Confirm new password" required>
                <small id="confirmError" class="text-danger"></small>
            </div>
            <button type="submit" class="btn btn-primary btn-custom">Send OTP</button>
            <div class="mt-3">
                <a href="developerlogin" class="text-decoration-none">Back to Login</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('email').addEventListener('input', function () {
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            document.getElementById('emailError').textContent = emailPattern.test(this.value) ? '' : 'Invalid email format';
        });
        document.getElementById('passwordForm').addEventListener('keyup', function () {
            const pass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const passErr = document.getElementById('passwordError');
            const confirmErr = document.getElementById('confirmError');

            if (pass.length < 8) {
                passErr.textContent = 'Password must be at least 8 characters long.';
            } else {
                passErr.textContent = '';
            }

            if (confirm !== pass) {
                confirmErr.textContent = 'Passwords do not match.';
            } else {
                confirmErr.textContent = '';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
