<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gradient-to-r from-green-100 to-green-200">
   {% include 'Admin/navbar.html' %}
    <div class="flex justify-center items-center min-h-screen">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-lg w-full border border-gray-300">
            <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Developer Registration</h2>
            <form action="send_otp_to_dev" method="POST" class="space-y-4">
                {% csrf_token %}

                <!-- Full Name -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Full Name</label>
                    <input type="text" name="full_name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="Enter your full name">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Email Address</label>
                    <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="Enter your email">
                </div>

                <!-- Education -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Education</label>
                    <input type="text" name="education" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="Enter your highest qualification">
                </div>

                <!-- Skills -->
               <div>
                  <label class="block text-gray-700 font-medium mb-2">Skills</label>
                  <input type="text" name="skills" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="e.g., Python, JavaScript, Django">
               </div>

                <!-- Experience Level -->
               <div>
                 <label class="block text-gray-700 font-medium mb-2">Experience Level</label>
                   <select name="experience" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none">
                     <option value="Fresher">Fresher</option>
                     <option value="1-3 years">1-3 years</option>
                     <option value="3-5 years">3-5 years</option>
                     <option value="5+ years">5+ years</option>
                   </select>
               </div>

               <!-- GitHub Profile -->
               <div>
                  <label class="block text-gray-700 font-medium mb-2">GitHub Profile</label>
                  <input type="url" name="github" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="Enter GitHub profile link">
               </div>

               <!-- Portfolio Website -->
               <div>
                 <label class="block text-gray-700 font-medium mb-2">Portfolio Website</label>
                 <input type="url" name="portfolio" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="Enter portfolio website (optional)">
               </div>


                <!-- Gender -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Gender</label>
                    <div class="flex space-x-4">
                        <label class="flex items-center space-x-2">
                            <input type="radio" name="gender" value="Male" required class="form-radio text-green-500">
                            <span>Male</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="radio" name="gender" value="Female" required class="form-radio text-green-500">
                            <span>Female</span>
                        </label>
                        <label class="flex items-center space-x-2">
                            <input type="radio" name="gender" value="Other" required class="form-radio text-green-500">
                            <span>Other</span>
                        </label>
                    </div>
                </div>

                <!-- Address -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Address</label>
                    <textarea name="address" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="Enter your address"></textarea>
                </div>

                <!-- Graduation Passout Year -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Graduation Passout Year</label>
                    <select name="passout_year" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none">
                        <script>
                            const currentYear = new Date().getFullYear();
                            for (let year = 2021; year <= currentYear; year++) {
                                document.write(`<option value="${year}">${year}</option>`);
                            }
                        </script>
                    </select>
                </div>

                <!-- Contact Number -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Contact Number</label>
                    <input type="tel" name="contact_number" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="Enter phone number">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="Enter password">
                    <input type="checkbox" onclick="password.type = this.checked ? 'text' : 'password' "><i style="font-size:15px;"> Check Password</i>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Confirm Password</label>
                    <input type="password" name="confirm_password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" placeholder="Confirm your password">
                </div>

                <!-- Register Button -->
                <div class="grid grid-flow-col grid-rows-1 ">
                <button type="submit" class="w-32 bg-green-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium text-lg">
                    Register
                </button><button type="reset" class="w-32 bg-red-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium text-lg">
                    Reset
                </button>
                  <a href="dev"><button type="button" class="w-32 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium text-lg">
                      Back
                </button></a>
              </div>

                <!-- Already Registered? -->
<!--                <p class="text-sm text-gray-600 text-center mt-4">-->
<!--                    Already have an account? <a href="" class="text-green-600 hover:underline font-medium">Login here</a>-->
<!--                </p>-->
            </form>
        </div>
    </div>
</body>
</html>
