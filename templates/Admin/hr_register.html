<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gradient-to-r from-blue-100 to-blue-200">
    {% include 'Admin/navbar.html' %}
    <br>
    <div class="flex justify-center items-center min-h-screen">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-lg w-full border border-gray-300">
            <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Recruiter Registration</h2>
            <form action="send_otp_to_hr" method="POST" class="space-y-4">
                {% csrf_token %}

                <!-- Full Name -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Full Name</label>
                    <input type="text" name="full_name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="Enter your full name">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Email Address</label>
                    <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="Enter your email">
                </div>

                <!-- Company Name -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Company Name</label>
                    <input type="text" name="company" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="Enter company name">
                </div>

                <!-- Job Position -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Your Job Position</label>
                    <input type="text" name="job_position" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="Enter job position">
                </div>

                <!-- Contact Number -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Contact Number</label>
                    <input type="tel" name="contact_number" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="Enter phone number">
                </div>

                <!-- Company Address -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Company Address</label>
                    <input type="text" name="company_address" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="Enter Company Address">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="Enter password">
                    <input type="checkbox" onclick="password.type = this.checked ? 'text' : 'password' "><i style="font-size:15px;"> Check Password</i>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Confirm Password</label>
                    <input type="password" name="confirm_password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="Confirm your password">
                </div>

                <!-- Register Button -->
              <div class="grid grid-flow-col grid-rows-1 ">
                <button type="submit" class="w-32 bg-green-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium text-lg">
                    Register
                </button><button type="reset" class="w-32 bg-red-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium text-lg">
                    Reset
                </button>
                  <a href="hr"><button type="button" class="w-32 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium text-lg">
                      Back
                </button></a>
              </div>

                <!-- Already Registered? -->
<!--                <p class="text-sm text-gray-600 text-center mt-4">-->
<!--                    Already have an account? <a href="" class="text-blue-600 hover:underline font-medium">Login here</a>-->
<!--                </p>-->
            </form>
        </div>
    </div>
</body>
</html>
