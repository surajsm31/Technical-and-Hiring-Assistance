<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="D:\fortune html\font-awesome-4.7.0\css\font-awesome.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>
<body class="flex items-center justify-center h-screen bg-blue-100">
    <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-semibold text-center text-gray-800">Admin Login</h2>
        {% if messages %}
    <div id="alert-message" class="fixed top-5 right-5 bg-green-500 text-white p-3 rounded shadow-lg">
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    </div>

    <script>
        // Automatically hide the alert message after 3 seconds
        setTimeout(function() {
            var alertBox = document.getElementById("alert-message");
            if (alertBox) {
                alertBox.style.display = "none";
            }
        }, 3000);
    </script>
{% endif %}

        <form action="admin_loginvalidate" method="post" enctype="multipart/form-data" class="mt-6">
            {% csrf_token %}
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" class="w-full px-4 py-2 mt-1 text-gray-700 bg-gray-200 border rounded-lg focus:outline-none focus:ring focus:border-blue-500" name="email" required>
            </div>
            <div class="mt-4">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2 mt-1 text-gray-700 bg-gray-200 border rounded-lg focus:outline-none focus:ring focus:border-blue-500" name="password" required>
            </div>
<!--            <div class="flex items-center justify-between mt-4">-->
<!--                <a href="#" class="text-sm text-blue-500 hover:underline">Forgot password?</a>-->
<!--            </div>-->
            <button type="submit" class="w-full px-4 py-2 mt-6 font-semibold text-white bg-blue-500 rounded-lg hover:bg-blue-600">Login</button>
        </form>
    </div>


<script>
          setTimeout(function()
          {
            if($("#msg").length > 0)
             {
                $("#msg").remove();
             }
          },3000);
</script>

</body>
</html>
