<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Add Test Category</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-green-100">

    <!-- Sidebar -->
    {% include 'Admin/navbar.html' %}
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-0 md:ml-64 transition-all duration-200 ease-in-out p-6" id="main-content">

        <!-- Add Test Category Form -->
        <div class="w-96 mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">
            {% if messages %}
    <div id="alert-message" class="fixed top-12 right-5 bg-red-500 text-white p-3 rounded shadow-lg">
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    </div>

    <script>
        // Automatically hide the alert message after 3 seconds
        setTimeout(function() {
            var alertBox = document.getElementById("alert-message");
            if (alertBox) {
                alertBox.style.display = "none";
            }
        }, 3000);
    </script>
{% endif %}
            <h3 class="text-2xl font-semibold text-center text-gray-700 mb-4">Add Test Category</h3>
            <form action="add_cate" method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-gray-700 font-semibold">Category Name</label>
                    <input type="text" name="category_name" class="w-full px-4 py-2 mt-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold">Domain Name</label>
                    <input type="text" name="domain_name" class="w-full px-4 py-2 mt-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div class="flex justify-between">
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded">Add Category</button>
                    <button type="reset" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded">Reset</button>
                    <a href="test_cate"><button type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">Back</button></a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
