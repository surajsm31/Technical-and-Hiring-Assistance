<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Admin Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gray-100 overflow-auto h-screen">
    {% include 'Admin/navbar.html' %}
        <!-- Main Content -->
        <div class="flex-1 flex flex-col ml-0 md:ml-64 transition-all duration-200 ease-in-out">
            <div class="max-w-3xl mt-10 mx-auto bg-white shadow-lg rounded-lg p-6">
                <h2 class="text-2xl font-semibold text-center text-gray-700">Admin Profile</h2>
                <form action="profile_update"  method="post" enctype="multipart/form-data" class="mt-6">
                    {% csrf_token %}
                    <div class="mb-4">
                        {% for i in data %}
                        <label class="block text-gray-600 text-sm font-semibold mb-2">Admin Name</label>
                        <input type="text" value="{{ i.Name }}" name="name" class="w-full px-4 py-2 border border-gray-300 rounded bg-gray-100 text-gray-600">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-600 text-sm font-semibold mb-2">Email</label>
                        <input type="email" value="{{ i.Email }}" name="email" class="w-full px-4 py-2 border border-gray-300 rounded bg-gray-100 text-gray-600 cursor-not-allowed" readonly>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-600 text-sm font-semibold mb-2">Contact</label>
                        <input type="text" value="{{ i.Contact }}" name="contact" class="w-full px-4 py-2 border border-gray-300 rounded bg-gray-100 text-gray-600" >
                    </div>
                    {% endfor %}
                     <div class="mt-6 flex justify-between">
                        <a href=""><button type="reset" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">Reset</button></a>
                        <a href=""><button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded">Update Profile</button></a>
                        <a href="admin_profile"><button type="button" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded">Go Back to Dashboard</button></a>
                    </div>
                </form>
            </div>
        </div>
</body>
</html>
