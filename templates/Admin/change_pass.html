<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body class="bg-blue-100 overflow-auto h-screen">
    {% include 'Admin/navbar.html' %}
    <!-- Main Content -->
    <div class="flex-1 flex flex-col mt-10 ml-0 md:ml-64 transition-all duration-200 ease-in-out">
        {% if messages %}
    <div id="alert-message" class="fixed top-12 right-5 bg-red-500 text-white p-3 rounded shadow-lg">
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    </div>

    <script>
        // Automatically hide the alert message after 3 seconds
        setTimeout(function() {
            var alertBox = document.getElementById("alert-message");
            if (alertBox) {
                alertBox.style.display = "none";
            }
        }, 3000);
    </script>
{% endif %}
        <div class="w-96 mx-auto bg-white shadow-lg rounded-lg p-6">
            <h2 class="text-2xl font-semibold text-gray-800 text-center mb-4">Change Password</h2>

            <form action="pass_change" method="POST">
                {% csrf_token %}
                {% for i in data %}
                <div class="mb-4">
                    <input type="" id="email" name="email" value="{{ i.Email }}" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-not-allowed" hidden>
                </div>
                {% endfor%}
                <div class="mb-4">
                    <label for="old_password" class="block text-gray-700 font-semibold">Old Password</label>
                    <input type="password" id="old_password" name="old_password" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label for="new_password" class="block text-gray-700 font-semibold">New Password</label>
                    <input type="password" id="new_password" name="new_password" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="block text-gray-700 font-semibold">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="ml-10 items-center justify-center">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">Submit</button>
                    <button type="reset" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded">Reset</button>
                    <a href="admin_profile" class="bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded">Back</a>
                </div>
            </form>
        </div>
    </div>
